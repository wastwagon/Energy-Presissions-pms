<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e17" />
    <title>Offline — Energy Precisions</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #fbfbfd;
        color: #0a0e17;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      h1 {
        font-size: 1.375rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
      }
      p {
        font-size: 0.9375rem;
        line-height: 1.55;
        color: #5c6370;
        margin-bottom: 24px;
      }
      a {
        display: inline-block;
        min-height: 48px;
        line-height: 48px;
        padding: 0 24px;
        background: #00e676;
        color: #0a0e17;
        font-weight: 600;
        text-decoration: none;
        border-radius: 999px;
        font-size: 0.9375rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You&apos;re offline</h1>
      <p>Check your connection and try again. Previously visited pages may still be available.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
